name: Deploy Shop Saldo to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: shop-saldo-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Restore Vite source HTML
        run: cp index.vite.html index.html
      - name: Build site
        run: npm run build
      - name: Publish compiled website for branch-based Pages
        run: |
          cp dist/index.html index.html
          mkdir -p assets
          cp -R dist/assets/. assets/
          touch .nojekyll
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m 'Publish compiled Shop Saldo website [skip ci]'
            git push origin HEAD:main
          fi
